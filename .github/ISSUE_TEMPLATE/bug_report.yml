name: Bug 反馈
description: 报告一个可复现的缺陷
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先确认这个缺陷在最新版本上仍然存在。

        **安全漏洞请勿在此报告**，见 [SECURITY.md](../SECURITY.md) 的私下报告流程。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 发布版本号或 commit SHA
      placeholder: v0.3.0 / a1b2c3d
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python 版本
      placeholder: 3.12.1
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 受影响模块
      options:
        - 8 阶段管线（engine）
        - 告警评分（scorer）
        - 升级策略（escalation）
        - 症状路由（symptom_router）
        - 事故摘要（incident_summary）
        - 补丁编排（patch_orchestrator）
        - 采集适配器（adapters）
        - 记忆存储（memory）
        - 仓库级（文档 / CI / 构建）
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望的行为 vs 实际的行为
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 如何复现
      description: 编号列出复现步骤，越具体越好。若是降噪行为异常，请附上告警样本（labels / severity / value）
      placeholder: |
        1. 创建引擎：AlertEngine(window_seconds=300)
        2. 喂入告警：Alert(..., severity="p1", labels={"host": "web-01"})
        3. 观察到 ……
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 错误日志或截图
      description: 如有报错信息请原样贴出（注意先移除其中的凭据与个人路径）
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已确认该问题在最新版本上仍然存在
          required: true
        - label: 我已搜索过现有 Issue，没有找到相同问题
          required: true
        - label: 我已移除日志/截图中的敏感信息
          required: false
